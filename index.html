<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8ef"><title>۲۰۴۸ — بازی هوشمند</title>
<style>
:root{--bg:#faf8ef;--ink:#514b42;--muted:#938c7e;--board:#b8aa98;--cell:#cbbfad;--accent:#edc850;--shadow:0 14px 40px #66563b18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -30%,#fff 0,transparent 65%),var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:32px 18px 44px}.app{width:min(100%,520px)}header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}.brand h1{font-size:clamp(44px,12vw,72px);line-height:.96;letter-spacing:-5px;margin:0;font-weight:900;color:#776e61}.brand p{margin:10px 0 0;color:var(--muted);font-size:14px}.scores{display:flex;gap:8px}.score-box{min-width:88px;padding:10px 12px;background:#bbada0;border-radius:8px;color:white;text-align:center;box-shadow:0 3px 0 #aa9d8c}.score-box small{display:block;font-size:11px;opacity:.85;margin-bottom:4px}.score-box strong{font-size:20px;font-weight:800;direction:ltr;display:block}.actions{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:9px}.message{font-size:14px;color:#766e61;font-weight:600}.buttons{display:flex;gap:8px}button{border:0;font:inherit;cursor:pointer;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.05);transform:translateY(-1px)}button:active{transform:translateY(1px)}.btn{color:white;background:#8f7a63;border-radius:7px;padding:11px 14px;font-weight:700;font-size:13px;box-shadow:0 3px 0 #76634f}.btn.secondary{background:#a99a87;box-shadow:0 3px 0 #91816d}.board-wrap{position:relative}.board{background:var(--board);padding:12px;border-radius:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;aspect-ratio:1;touch-action:none;box-shadow:var(--shadow);user-select:none}.cell{border-radius:7px;background:var(--cell);display:flex;align-items:center;justify-content:center;font-size:clamp(25px,8vw,48px);font-weight:800;letter-spacing:-2px;color:#776e65;transition:background .12s,transform .12s;position:relative}.cell.tile{animation:pop .15s ease-out}.cell[data-v="2"]{background:#eee4da}.cell[data-v="4"]{background:#ede0c8}.cell[data-v="8"]{background:#f2b179;color:#fff}.cell[data-v="16"]{background:#f59563;color:#fff}.cell[data-v="32"]{background:#f67c5f;color:#fff}.cell[data-v="64"]{background:#f65e3b;color:#fff}.cell[data-v="128"]{background:#edcf72;color:white;font-size:clamp(21px,6vw,38px)}.cell[data-v="256"]{background:#edcc61;color:white;font-size:clamp(21px,6vw,38px)}.cell[data-v="512"]{background:#edc850;color:white;font-size:clamp(21px,6vw,38px)}.cell[data-v="1024"]{background:#edc53f;color:white;font-size:clamp(18px,5vw,31px);letter-spacing:-1px}.cell[data-v="2048"]{background:#edc22e;color:white;font-size:clamp(18px,5vw,31px);box-shadow:inset 0 0 0 2px #fff8}.cell.high{background:#3c3a32;color:#fff;font-size:clamp(17px,5vw,30px);letter-spacing:-1px}.overlay{position:absolute;inset:0;border-radius:10px;background:#faf8efd9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fade .2s}.overlay[hidden]{display:none}.overlay h2{font-size:36px;margin:0 0 8px}.overlay p{margin:0 0 18px;color:#776e65}.overlay .btn{font-size:15px}.hint{margin:19px 0 0;text-align:center;color:#938c7e;font-size:13px;line-height:1.9}.hint b{color:#776e65}.stats{margin-top:24px;padding:16px 18px;border:1px solid #e8e3d8;border-radius:10px;display:flex;justify-content:space-between;gap:12px;background:#ffffff70}.stat{display:flex;flex-direction:column;gap:4px}.stat span{font-size:11px;color:var(--muted)}.stat strong{font-size:15px}.footer{text-align:center;color:#aaa292;font-size:11px;margin-top:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#514b42;color:white;padding:10px 17px;border-radius:30px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pop{0%{transform:scale(.78)}100%{transform:scale(1)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:430px){body{padding:24px 14px}.score-box{min-width:72px;padding:8px 9px}.score-box strong{font-size:17px}.board{gap:9px;padding:9px}.actions{align-items:flex-start}.message{font-size:12px;padding-top:8px}.btn{padding:10px 11px;font-size:12px}.stats{padding:13px 12px}.stat strong{font-size:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="app"><header><div class="brand"><h1>۲۰۴۸</h1><p>عددها را ترکیب کن، به هدف برس!</p></div><div class="scores"><div class="score-box"><small>امتیاز</small><strong id="score">۰</strong></div><div class="score-box"><small>بهترین</small><strong id="best">۰</strong></div></div></header><div class="actions"><div class="message">هر حرکت، یک قدم تا ۲۰۴۸</div><div class="buttons"><button class="btn secondary" id="undo" title="بازگشت یک حرکت">↶ بازگشت</button><button class="btn" id="newGame">بازی جدید</button></div></div><section class="board-wrap" aria-label="صفحه بازی"><div class="board" id="board" role="grid" aria-label="صفحه بازی ۲۰۴۸"></div><div class="overlay" id="overlay" hidden><h2 id="overTitle"></h2><p id="overText"></p><button class="btn" id="continueBtn" hidden>ادامه بازی</button><button class="btn" id="restartBtn">دوباره بازی کن</button></div></section><p class="hint">با کلیدهای <b>جهت‌نما</b> یا <b>W A S D</b> بازی کن؛ در موبایل صفحه را بکش.<br>برای بازگشت از دکمهٔ ↶ استفاده کن.</p><section class="stats"><div class="stat"><span>بیشترین خانه</span><strong id="maxTile">—</strong></div><div class="stat"><span>بازی‌های انجام‌شده</span><strong id="games">۰</strong></div><div class="stat"><span>رکورد شخصی</span><strong id="personal">هنوز ثبت نشده</strong></div></section><div class="footer">پیشرفت و رکورد شما فقط در همین مرورگر ذخیره می‌شود.</div></main><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const KEY='2048-fa-pro-v1',$=id=>document.getElementById(id),boardEl=$('board'),fa=n=>Number(n).toLocaleString('fa-IR'),empty=()=>Array.from({length:4},()=>Array(4).fill(0));let state,history=[],toastTimer;
function fresh(){return{grid:empty(),score:0,won:false,over:false,games:0,best:0,started:0}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.grid?.length===4)return{...fresh(),...x}}catch{}return fresh()}
state=load();function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function addTile(){const slots=[];state.grid.forEach((r,y)=>r.forEach((v,x)=>{if(!v)slots.push([y,x])}));if(!slots.length)return;const [y,x]=slots[Math.floor(Math.random()*slots.length)];state.grid[y][x]=Math.random()<.9?2:4}
function start(){state.games=(state.games||0)+1;state.grid=empty();state.score=0;state.won=false;state.over=false;state.started=Date.now();history=[];addTile();addTile();persist();render()}
function render(){boardEl.innerHTML='';let max=0;for(const row of state.grid)for(const v of row)max=Math.max(max,v);state.grid.forEach((row,y)=>row.forEach((v,x)=>{const c=document.createElement('div');c.className='cell'+(v?' tile':'');c.setAttribute('role','gridcell');c.setAttribute('aria-label',v?`ردیف ${y+1} ستون ${x+1}: ${v}`:'خالی');if(v){c.textContent=fa(v);c.dataset.v=v;if(v>2048)c.classList.add('high')}boardEl.appendChild(c)}));$('score').textContent=fa(state.score);$('best').textContent=fa(state.best);$('games').textContent=fa(state.games||0);$('maxTile').textContent=max?fa(max):'—';$('personal').textContent=state.best?`${fa(state.best)} امتیاز`:'هنوز ثبت نشده';$('undo').disabled=!history.length;$('undo').style.opacity=history.length?1:.55;const ov=$('overlay');ov.hidden=!(state.over||(state.won&&!state.keepPlaying));if(!ov.hidden){$('overTitle').textContent=state.over?'پایان بازی':'آفرین!';$('overText').textContent=state.over?'دیگر حرکتی باقی نمانده است.':'به خانهٔ ۲۰۴۸ رسیدی! می‌توانی ادامه بدهی.';$('continueBtn').hidden=state.over}persist()}
function snapshot(){return JSON.stringify({grid:state.grid,score:state.score,won:state.won,over:state.over,keepPlaying:state.keepPlaying})}
function canMove(){for(let y=0;y<4;y++)for(let x=0;x<4;x++){if(!state.grid[y][x])return true;if(x<3&&state.grid[y][x]===state.grid[y][x+1])return true;if(y<3&&state.grid[y][x]===state.grid[y+1][x])return true}return false}
function move(dir){if(state.over||(state.won&&!state.keepPlaying))return;const before=snapshot(),g=state.grid.map(r=>r.slice());let gained=0;for(let i=0;i<4;i++){let line=[];for(let j=0;j<4;j++){let y=dir==='up'?j:dir==='down'?3-j:i,x=dir==='left'?j:dir==='right'?3-j:i;line.push(g[y][x])}let a=line.filter(Boolean),out=[];for(let k=0;k<a.length;k++){if(a[k]===a[k+1]){const v=a[k]*2;out.push(v);gained+=v;k++}else out.push(a[k])}while(out.length<4)out.push(0);for(let j=0;j<4;j++){let y=dir==='up'?j:dir==='down'?3-j:i,x=dir==='left'?j:dir==='right'?3-j:i;state.grid[y][x]=out[j]}}
if(JSON.stringify(g)===JSON.stringify(state.grid))return;history.push(before);if(history.length>1)history.shift();state.score+=gained;state.best=Math.max(state.best,state.score);addTile();if(!state.won&&state.grid.some(r=>r.includes(2048))){state.won=true;state.keepPlaying=false}if(!canMove())state.over=true;render()}
function undo(){if(!history.length)return;const s=JSON.parse(history.pop());Object.assign(state,s);render()}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();move(map[e.key])}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}});let touch=null;boardEl.addEventListener('pointerdown',e=>{touch=[e.clientX,e.clientY]});boardEl.addEventListener('pointerup',e=>{if(!touch)return;let dx=e.clientX-touch[0],dy=e.clientY-touch[1];touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});$('newGame').onclick=()=>{if(state.score&& !confirm('بازی فعلی تمام شود و بازی جدید شروع شود؟'))return;start()};$('restartBtn').onclick=start;$('undo').onclick=undo;$('continueBtn').onclick=()=>{state.keepPlaying=true;render()};if(!state.started)start();else render()})();
</script></body></html>
